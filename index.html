<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السعودية للطاقة - قسم الصيانة</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#142033;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(135deg,#001f5e,#087fc1);padding:14px;color:#fff}.head,main{max-width:1500px;margin:auto}.head{display:flex;align-items:center;gap:16px}.logo{width:230px;height:82px;background:#fff;border-radius:12px;padding:4px}.logo img{width:100%;height:100%;object-fit:contain}.title h1{margin:0;font-size:22px}.title p{margin:5px 0}.tools,.stat,.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px #0001}.tools{padding:13px;display:flex;gap:8px;margin-bottom:13px}main{padding:18px 10px}input{flex:1;padding:14px;border:1px solid #d6e0e7;border-radius:10px;font-size:16px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#001f5e;color:#fff}.clear{background:#e9f1f6;color:#001f5e}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}.stat{padding:10px 16px}.stat small{display:block;color:#667}.table{overflow:auto}table{width:100%;min-width:820px;border-collapse:collapse}th{background:#edf4f8;color:#123c58;padding:12px;text-align:right}td{padding:10px;border-bottom:1px solid #edf0f3}.coord{font-family:Consolas,monospace;direction:ltr}.map{display:inline-block;background:#00a879;color:#fff;text-decoration:none;border-radius:8px;padding:8px 11px;font-size:12px}.pages{text-align:center;padding:14px}.page{margin:3px;background:#fff;color:#001f5e;border:1px solid #d5e0e7}.active{background:#001f5e;color:#fff}.empty,.loader{text-align:center;padding:40px;color:#777}@media(max-width:650px){.logo{width:175px;height:65px}.title h1{font-size:17px}}</style></head><body><header><div class="head"><div class="logo"><img src="logo.png"></div><div class="title"><h1>قاعدة بيانات مواقع العدادات</h1><p>قسم الصيانة</p></div></div></header><main><div class="tools"><input id="q" placeholder="ابحث برقم الحساب، الاشتراك، الرقم التفصيلي أو الإحداثية..."><button onclick="clearSearch()">مسح</button></div><div class="stats"><div class="stat"><small>إجمالي السجلات</small><b id="total">تحميل...</b></div><div class="stat"><small>نتائج البحث</small><b id="count">-</b></div></div><div class="card"><div id="loader" class="loader">جارٍ تحميل قاعدة البيانات...</div><div class="table"><table id="tbl" style="display:none"><thead><tr><th>#</th><th>رقم الحساب</th><th>رقم الاشتراك</th><th>الرقم التفصيلي</th><th>إحداثية العداد</th><th>الموقع</th></tr></thead><tbody id="body"></tbody></table></div><div class="pages"><button id="prev" class="page" onclick="setPage(page-1)">السابق</button><span id="nums"></span><button id="next" class="page" onclick="setPage(page+1)">التالي</button></div></div></main><script>
const FILES=["part-1.json", "part-2.json", "part-3.json", "part-4.json", "part-5.json", "part-6.json", "part-7.json", "part-8.json", "part-9.json", "part-10.json", "part-11.json", "part-12.json", "part-13.json", "part-14.json", "part-15.json"],S=100;let D=[],F=[],page=1,$=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{D=(await Promise.all(FILES.map(f=>fetch('data/'+f).then(r=>r.json())))).flat();F=D.map((_,i)=>i);$('loader').style.display='none';$('tbl').style.display='table';render()}catch(e){$('loader').textContent='تعذر تحميل البيانات. تأكد من رفع مجلد data كاملاً.'}}
function render(){let st=(page-1)*S,rs=F.slice(st,st+S),tp=Math.max(1,Math.ceil(F.length/S));$('body').innerHTML=rs.map((i,j)=>{let r=D[i];return `<tr><td>${st+j+1}</td><td>${esc(r.a)}</td><td>${esc(r.s)}</td><td>${esc(r.d)}</td><td class="coord">${esc(r.c)}</td><td>${r.lat==null?'غير متوفر':`<a class="map" target="_blank" href="https://www.google.com/maps?q=${r.lat},${r.lng}">📍 فتح الموقع</a>`}</td></tr>`}).join('');$('total').textContent=D.length.toLocaleString('ar-SA');$('count').textContent=F.length.toLocaleString('ar-SA');$('prev').disabled=page<=1;$('next').disabled=page>=tp;let a='';for(let p=Math.max(1,page-3);p<=Math.min(tp,page+3);p++)a+=`<button class="page ${p==page?'active':''}" onclick="setPage(${p})">${p}</button>`;$('nums').innerHTML=a}
function setPage(p){let tp=Math.max(1,Math.ceil(F.length/S));page=Math.max(1,Math.min(tp,p));render();scrollTo(0,0)}
function clearSearch(){$('q').value='';apply()}function apply(){let q=$('q').value.trim().toLowerCase();F=q?D.map((r,i)=>[r,i]).filter(x=>(x[0].a+' '+x[0].s+' '+x[0].d+' '+x[0].c).toLowerCase().includes(q)).map(x=>x[1]):D.map((_,i)=>i);page=1;render()}$('q').addEventListener('input',apply);load();
</script></body></html>
