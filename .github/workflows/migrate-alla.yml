name: Migrate alla to sec

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sec
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete alla project
        run: |
          git clone --depth 1 https://github.com/ops11141/alla.git /tmp/alla
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/alla/. .

      - name: Commit migrated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Migrate complete alla project to sec"
          git push origin HEAD:main
