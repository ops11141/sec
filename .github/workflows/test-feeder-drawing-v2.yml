name: Test feeder drawing v2

on:
  workflow_dispatch:
  push:
    paths:
      - "cad/FINAL DISPATCH - UPDATE.dwg"
      - "tools/test-feeder-drawing-v2.py"
      - "tools/build-drawing-search-assets.py"
      - "tools/render-mobile-overview.py"
      - ".github/workflows/test-feeder-drawing-v2.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreDWG
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config cmake \
            libpcre2-dev libxml2-dev texinfo wget
          cd /tmp
          rm -rf libredwg-0.14 libredwg-0.14.tar.xz
          wget -q --show-progress \
            https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz
          test -s libredwg-0.14.tar.xz
          tar -xf libredwg-0.14.tar.xz
          cd libredwg-0.14

          # LibreDWG 0.14 is an Autotools release (not CMake).
          # Build the library first because programs/dwg2dxf depends on libredwg.la.
          ./configure \
            --disable-shared \
            --disable-bindings \
            --disable-docs \
            --disable-json

          timeout 12m make -j"$(nproc)" -C src
          timeout 12m make -j"$(nproc)" -C programs dwg2dxf

          sudo install -m 0755 programs/dwg2dxf /usr/local/bin/dwg2dxf
          command -v dwg2dxf
          dwg2dxf --version

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ezdxf matplotlib

      - name: Convert DWG to DXF
        run: |
          dwg2dxf -o /tmp/final-dispatch.dxf "cad/FINAL DISPATCH - UPDATE.dwg"

      - name: Render F-8.13 as one full drawing
        run: |
          python3 tools/test-feeder-drawing-v2.py

      - name: Render lightweight mobile overview
        run: |
          python3 tools/render-mobile-overview.py
          test -s data/feeders/mobile-overview.jpg

      - name: Build searchable drawing focus assets
        run: |
          python3 tools/build-drawing-search-assets.py
          test -s data/feeders/drawing-search.jpg
          test -s data/feeders/drawing-search-index.json

      - name: Commit test drawing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeders/drawings data/feeders/mobile-overview.jpg data/feeders/drawing-search.jpg data/feeders/drawing-search-index.json
          if git diff --cached --quiet; then
            echo "No drawing changes."
          else
            git commit -m "Publish mobile high quality drawing assets"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Drawing pushed successfully."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            exit 1
          fi
