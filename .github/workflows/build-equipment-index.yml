name: Build equipment location index

on:
  workflow_dispatch:
  push:
    paths:
      - "data/part-*.json"
      - "equipment.html"
      - "tools/build-equipment-index.py"
      - ".github/workflows/build-equipment-index.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build lightweight equipment index
        run: |
          python3 tools/build-equipment-index.py

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equipment-index.json data/equipment-lookup.json
          if git diff --cached --quiet; then
            echo "No equipment index changes."
          else
            git commit -m "Build lightweight equipment location index"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Equipment index pushed successfully."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            exit 1
          fi
