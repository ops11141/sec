name: Build feeder database

on:
  workflow_dispatch:
  push:
    paths:
      - "cad/FINAL DISPATCH - UPDATE.dwg"
      - "tools/build-feeders.mjs"
      - "package.json"
      - ".github/workflows/build-feeder-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LibreDWG
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y             build-essential             autoconf             automake             libtool             pkg-config             libpcre2-dev             libxml2-dev             texinfo             wget             ca-certificates

          cd /tmp
          rm -rf libredwg-0.14 libredwg-0.14.tar.xz

          wget -q --show-progress             https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz

          test -s libredwg-0.14.tar.xz
          tar -xf libredwg-0.14.tar.xz

          cd libredwg-0.14

          ./configure             --disable-shared             --disable-bindings             --disable-docs

          make -j2
          sudo make install
          sudo ldconfig

          command -v dwg2dxf
          dwg2dxf --version

      - name: Install Node dependencies
        run: npm install

      - name: Build feeder database
        run: npm run build:feeders

      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/feeders

          if git diff --cached --quiet; then
            echo "No generated feeder database changes."
          else
            git commit -m "Build feeder database from DWG"

            # Another workflow/manual edit may have advanced main while this
            # build was running. Rebase onto the latest main before pushing.
            # This avoids non-fast-forward failures caused by concurrent pushes.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Generated feeder database pushed successfully."
                  exit 0
                fi
              fi

              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed; refreshing main and retrying..."
              sleep 3
            done

            echo "Unable to push generated feeder database after 3 attempts."
            exit 1
          fi
